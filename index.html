<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BibleFollow – Read, Study & Understand the Bible</title>

    <meta name="description"
          content="BibleFollow helps you read, study and understand the Bible with daily verses, study tools and AI-powered Bible assistance.">

    <meta name="robots" content="index, follow">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                         Roboto, Helvetica, Arial, sans-serif;
            background: #07120e;
            color: #fff;
        }

        .hero {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 40px 20px;
            background:
                radial-gradient(circle at top, #164b35 0%, #07120e 55%);
        }

        .container {
            max-width: 900px;
        }

        .brand {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 60px;
        }

        h1 {
            font-size: clamp(48px, 8vw, 88px);
            line-height: 1.02;
            letter-spacing: -3px;
            margin-bottom: 25px;
        }

        .highlight {
            color: #75e6a4;
        }

        p {
            max-width: 650px;
            margin: auto;
            color: #b8c7c0;
            font-size: 20px;
            line-height: 1.6;
        }

        .buttons {
            margin-top: 40px;
        }

        .button {
            display: inline-block;
            background: #fff;
            color: #07120e;
            padding: 16px 28px;
            margin: 8px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 700;
        }
    </style>
</head>

<body>

<section class="hero">
    <div class="container">

        <div class="brand">
            BibleFollow
        </div>

        <h1>
            Understand the Bible.<br>
            <span class="highlight">Grow every day.</span>
        </h1>

        <p>
            Read Scripture, discover meaningful insights and build
            a deeper daily relationship with God's Word.
        </p>

        <div class="buttons">

            <a class="button"
               href="#"
               aria-label="Download BibleFollow on the App Store">
                Download on the App Store
            </a>

        </div>

    </div>
</section>

</body>
</html>
